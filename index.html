<style>
/* Saira (SIL Open Font License, fonts/OFL.txt) – lokal eingebunden */
@font-face { font-family: "Saira"; src: url("fonts/saira-500.woff2") format("woff2"); font-weight: 500; font-style: normal; font-display: swap; }
@font-face { font-family: "Saira"; src: url("fonts/saira-600.woff2") format("woff2"); font-weight: 600; font-style: normal; font-display: swap; }
@font-face { font-family: "Saira"; src: url("fonts/saira-700.woff2") format("woff2"); font-weight: 700; font-style: normal; font-display: swap; }
@font-face { font-family: "Saira"; src: url("fonts/saira-800-italic.woff2") format("woff2"); font-weight: 800; font-style: italic; font-display: swap; }

/* ------------------------------------------------------------------------
   Design-Tokens – nur hier festlegen. Ampelfarben NUR für Zustände.
   ------------------------------------------------------------------------ */
:root {
  --brand: #0050E6;
  --brand-tint: #E8EFFF;
  --ink: #0B1B3F;          /* Text, Statuskarte */
  --bg: #F5F6F8;
  --surface: #FFFFFF;
  --hairline: #ECEEF2;
  --muted: #5E6878;
  --chevron: #A0A8B6;
  --segment: #E9EBF0;
  --stepper: #F2F4F7;
  --field: #8A94A6;        /* Rahmen von Eingabefeldern (≥ 3:1) */
  --on-ink-muted: #B9C3D6;
  --crit-text: #B42318; --crit-dot: #F04438; --crit-bg: #FEF3F2;
  --warn-text: #93370D; --warn-dot: #F79009; --warn-bg: #FFFAEB;
  --ok-text: #067647;   --ok-dot: #17B26A;   --ok-bg: #ECFDF3;
  --ord-text: #0045C8;  --ord-dot: #2E6BFF;  --ord-bg: #EEF4FF;
  --display: "Saira", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --shadow: 0 8px 24px rgba(11, 27, 63, 0.10);
  --tabbar: 60px;          /* Höhe der schwebenden Tab-Leiste */
  --tab-gap: 12px;         /* Abstand zum unteren Rand */
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh;
  background: var(--bg); color: var(--ink);
  font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-tap-highlight-color: transparent;
}
p { margin: 0 0 10px; }
a { color: var(--brand); }
svg { flex: none; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
.sr { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.muted, .meta { color: var(--muted); }
.meta { display: block; font-size: 15px; }
.num { font-family: var(--display); font-variant-numeric: tabular-nums; }

/* Zustände: s0 OK, s1 Warnung, s2 kritisch, s3 bestellt */
.s0 { --st-text: var(--ok-text);   --st-dot: var(--ok-dot);   --st-bg: var(--ok-bg); }
.s1 { --st-text: var(--warn-text); --st-dot: var(--warn-dot); --st-bg: var(--warn-bg); }
.s2 { --st-text: var(--crit-text); --st-dot: var(--crit-dot); --st-bg: var(--crit-bg); }
.s3 { --st-text: var(--ord-text);  --st-dot: var(--ord-dot);  --st-bg: var(--ord-bg); }
.t { color: var(--st-text); }
.dot { flex: none; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--st-dot); }
.stat { display: inline-flex; align-items: center; gap: 7px; color: var(--st-text); font-size: 15px; font-weight: 600; }
.stat svg { width: 17px; height: 17px; }
.disc { flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--st-bg); color: var(--st-text); }
.disc svg { width: 19px; height: 19px; }

/* Kopf (ohne farbigen Balken) */
.top { max-width: 760px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 6px) calc(env(safe-area-inset-right) + 16px) 0 calc(env(safe-area-inset-left) + 16px); }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; }
.brandmark { display: flex; align-items: baseline; gap: 10px; }
.wordmark { font-family: var(--display); font-weight: 800; font-style: italic; font-size: 24px; color: var(--brand); letter-spacing: 0.01em; }
.icon-btn { flex: none; width: 44px; height: 44px; margin-right: -8px; display: grid; place-items: center; border-radius: 12px; color: var(--ink); }
.icon-btn svg { width: 26px; height: 26px; }
.back, .toplink { display: inline-flex; align-items: center; gap: 2px; min-height: 44px; min-width: 44px; color: var(--brand); text-decoration: none; font-weight: 600; max-width: 70%; }
.back { margin-left: -6px; }
.back svg { width: 24px; height: 24px; }
.back span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kicker { margin: 10px 0 0; color: var(--muted); font-size: 15px; }
.title { margin: 4px 0 4px; font-family: var(--display); font-size: 34px; font-weight: 600; line-height: 1.1; overflow-wrap: anywhere; }
.title:focus { outline: none; }
.sub { margin: 0; color: var(--muted); }

main {
  max-width: 760px; margin: 0 auto;
  padding: 16px calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + var(--tabbar) + var(--tab-gap) + 32px) calc(env(safe-area-inset-left) + 16px);
}
body.has-action main { padding-bottom: calc(env(safe-area-inset-bottom) + var(--tabbar) + var(--tab-gap) + 110px); }
.section { margin: 28px 4px 10px; font-family: var(--display); font-size: 20px; font-weight: 600; line-height: 1.2; }
.sectionrow { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.sectionrow .section { margin-right: auto; }
.caps { margin: 24px 4px 8px; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.linkbtn { min-height: 44px; padding: 0 4px; border: 0; background: none; color: var(--brand); font: inherit; font-weight: 600; cursor: pointer; }

/* Gruppierte Listen */
.group { list-style: none; margin: 0; padding: 0; background: var(--surface); border-radius: 18px; overflow: hidden; }
.group > li + li { border-top: 1px solid var(--hairline); }
.row {
  display: flex; align-items: center; gap: 12px; width: 100%; min-height: 60px; padding: 12px 12px 12px 16px;
  border: 0; background: none; color: var(--ink); font: inherit; text-align: left; text-decoration: none; cursor: pointer;
}
.row-main { flex: 1; min-width: 0; display: grid; gap: 2px; }
.row-title { font-weight: 600; overflow-wrap: anywhere; }
.row-right { flex: none; display: flex; align-items: center; gap: 12px; font-weight: 600; }
.chev { width: 20px; height: 20px; color: var(--chevron); }
.row.add { color: var(--brand); font-weight: 600; }
.row.add svg { width: 22px; height: 22px; }
.cnt { display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.foot { padding: 12px 16px; color: var(--muted); font-size: 15px; background: var(--surface); }

/* Statuskarte */
.statuscard { margin: 18px 0 4px; padding: 18px; border-radius: 22px; background: var(--ink); color: #fff; }
.sc-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.sc-big { font-family: var(--display); font-weight: 600; font-size: 46px; line-height: 1; font-variant-numeric: tabular-nums; }
.sc-big .of { font-size: 26px; color: var(--on-ink-muted); }
.sc-label { margin: 6px 0 0; }
.sc-side { text-align: right; font-size: 14px; line-height: 1.6; color: var(--on-ink-muted); }
.sc-side .num { color: #fff; font-size: 16px; }
.stack { display: flex; gap: 3px; height: 8px; margin: 16px 0 12px; border-radius: 999px; overflow: hidden; background: rgba(255, 255, 255, 0.14); }
.stack span { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 0; padding: 0; list-style: none; font-size: 14px; }
.legend li { display: inline-flex; align-items: center; gap: 7px; }

/* Segment-Steuerung */
.seg { display: flex; gap: 2px; height: 40px; padding: 3px; margin: 16px 0; border-radius: 12px; background: var(--segment); }
.seg > a, .seg > button {
  position: relative; flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; padding: 0 8px;
  border: 0; border-radius: 9px; background: transparent; color: var(--muted);
  font: inherit; font-size: 15px; font-weight: 600; text-decoration: none; cursor: pointer; white-space: nowrap;
}
.seg > a::before, .seg > button::before { content: ""; position: absolute; inset: -5px 0; } /* Trefferfläche 44px */
.seg > a > span, .seg > button > span { overflow: hidden; text-overflow: ellipsis; }
.seg > [aria-pressed="true"], .seg > [aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(11, 27, 63, 0.14); }

/* Felder */
input, select, textarea {
  width: 100%; min-height: 48px; padding: 10px 12px;
  border: 1.5px solid var(--field); border-radius: 12px;
  background: var(--surface); color: var(--ink); font: inherit;
}
input::placeholder, textarea::placeholder { color: var(--muted); opacity: 1; }
textarea { min-height: 96px; resize: vertical; }
input[type="search"] { -webkit-appearance: none; appearance: none; }
input[type="checkbox"], input[type="radio"] { width: 24px; height: 24px; min-height: 0; margin: 0; flex: none; accent-color: var(--brand); }
.search { position: relative; margin: 16px 0 0; }
.search svg { position: absolute; left: 14px; top: 50%; width: 20px; height: 20px; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search input { padding-left: 42px; border-color: transparent; background: var(--segment); }
.search input:focus { border-color: var(--brand); background: var(--surface); }
.field { display: grid; gap: 6px; margin: 0 0 14px; }
.field label, legend { font-weight: 600; }
.hint { margin: 8px 4px 0; font-size: 15px; color: var(--muted); }
fieldset { border: 0; padding: 0; margin: 0 0 14px; display: grid; gap: 10px; min-width: 0; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.row2 label { display: grid; gap: 6px; font-weight: 400; }
.check, .radio { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 8px 12px; border: 1.5px solid var(--hairline); border-radius: 12px; cursor: pointer; }
.radio:has(input:checked) { border-color: var(--brand); background: var(--brand-tint); }
.formrow { padding: 12px 16px; display: grid; gap: 6px; }
.formrow label { font-size: 15px; font-weight: 600; color: var(--muted); }

/* Knöpfe */
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 48px; padding: 10px 16px;
  border: 0; border-radius: 14px; background: var(--stepper); color: var(--ink);
  font: inherit; font-weight: 600; text-align: center; text-decoration: none; cursor: pointer; touch-action: manipulation;
}
.btn svg { width: 22px; height: 22px; }
.btn.primary { min-height: 56px; border-radius: 16px; background: var(--brand); color: #fff; font-size: 18px; }
.btn.primary .extra { margin-left: auto; font-weight: 500; font-size: 16px; opacity: 0.9; }
.btn.primary.split { justify-content: flex-start; padding: 0 20px; }
.btn.ink { background: var(--ink); color: #fff; }
.btn.small { width: auto; min-height: 44px; padding: 8px 14px; font-size: 15px; border-radius: 12px; }
.btn.ord { background: var(--ord-bg); color: var(--ord-text); }
.btn:disabled, .btn[aria-disabled="true"] { opacity: 0.45; cursor: not-allowed; }
.actions { display: grid; gap: 10px; margin: 14px 0 0; }

/* Hinweise */
.note { display: flex; gap: 10px; align-items: flex-start; margin: 12px 0 0; padding: 12px 14px; border-radius: 14px; background: var(--brand-tint); font-size: 15px; }
.note svg { width: 20px; height: 20px; color: var(--brand); margin-top: 1px; }
.note.s1 { background: var(--warn-bg); color: var(--warn-text); }
.note.s1 svg { color: var(--warn-text); }

/* Prüfung */
.progress { margin: 14px 4px 0; font-size: 17px; }
.progress .num { font-size: 22px; font-weight: 600; }
.ordercard { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin: 16px 0 0; padding: 14px 16px; border-radius: 18px; background: var(--surface); }
.ordercard .oc-main { flex: 1 1 170px; display: flex; align-items: center; gap: 12px; min-width: 0; }
.ordercard .disc { background: var(--ord-bg); color: var(--ord-text); }
.ordercard .btn { margin-left: auto; background: var(--brand); color: #fff; }
.item { padding: 14px 12px 12px 16px; display: grid; gap: 8px; }
.item-top { display: flex; align-items: center; gap: 10px; }
.item-name { flex: 1; min-width: 0; min-height: 44px; padding: 0; border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.item-name .nm { display: block; font-weight: 600; overflow-wrap: anywhere; }
.item-bottom { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 28px; }
.stepper { flex: none; display: flex; align-items: center; padding: 2px; border-radius: 999px; background: var(--stepper); }
.sbtn { width: 44px; height: 44px; padding: 0; display: grid; place-items: center; border: 0; border-radius: 50%; background: transparent; color: var(--brand); cursor: pointer; touch-action: manipulation; }
.sbtn svg { width: 20px; height: 20px; }
.sbtn:disabled { color: var(--chevron); cursor: not-allowed; }
.sval { min-width: 52px; text-align: center; font-size: 19px; font-weight: 600; white-space: nowrap; }
.sval small { font-size: 15px; color: var(--muted); }

/* Bestellung */
.oqty { flex: none; text-align: right; }
.oqty .num { font-size: 24px; font-weight: 600; }
.oqty small { margin-left: 3px; color: var(--muted); font-size: 14px; }
details.group > summary { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 56px; padding: 12px 16px; font-weight: 600; cursor: pointer; list-style: none; }
details.group > summary::-webkit-details-marker { display: none; }
details.group > summary svg { width: 20px; height: 20px; color: var(--chevron); transition: transform 0.2s; }
details.group[open] > summary svg { transform: rotate(180deg); }
.dist { padding: 0 16px 14px; border-top: 1px solid var(--hairline); }
.dist h3 { margin: 14px 0 4px; font-size: 15px; font-weight: 700; }
.dist h4 { margin: 8px 0 2px 12px; font-size: 15px; font-weight: 600; }
.dist h4 a { display: inline-flex; align-items: center; min-height: 44px; }
.dist ul { margin: 0 0 0 24px; padding: 0; list-style: none; font-size: 15px; }
.dist li { padding: 2px 0; }
.mailtext { white-space: pre-wrap; font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; margin: 0; padding: 14px 16px; overflow-x: auto; }

/* Protokoll */
.log-list ul { margin: 6px 0 0; padding-left: 1.2em; font-size: 15px; }

/* Hauptknopf über weichem Verlauf */
#action {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  padding: 24px calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + var(--tabbar) + var(--tab-gap) + 10px) calc(env(safe-area-inset-left) + 16px);
  background: linear-gradient(to bottom, rgba(245, 246, 248, 0), var(--bg) 22px);
}
#action[hidden] { display: none; }
#action .btn { max-width: 728px; margin: 0 auto; }

/* Schwebende Tab-Leiste */
.tabbar {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + var(--tab-gap)); z-index: 25;
  transform: translateX(-50%); display: flex; gap: 4px; height: var(--tabbar); padding: 5px;
  border: 1px solid var(--hairline); border-radius: 999px; background: rgba(255, 255, 255, 0.92);
  box-shadow: var(--shadow); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
}
.tab {
  display: flex; align-items: center; justify-content: center; gap: 8px; min-width: 132px; height: 100%; padding: 0 18px;
  border-radius: 999px; color: var(--muted); text-decoration: none; font-size: 15px; font-weight: 600;
}
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { background: var(--brand-tint); color: var(--brand); }

/* Update-Hinweis */
#update { position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; padding: 12px calc(env(safe-area-inset-right) + 12px) calc(env(safe-area-inset-bottom) + 12px) calc(env(safe-area-inset-left) + 12px); background: var(--bg); box-shadow: 0 -6px 20px rgba(11, 27, 63, 0.18); }
#update[hidden] { display: none; }
#update button { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; max-width: 728px; margin: 0 auto; min-height: 72px; padding: 12px; border: 0; border-radius: 18px; background: var(--ink); color: #fff; font: inherit; font-size: 18px; font-weight: 650; cursor: pointer; }
#update svg { width: 24px; height: 24px; }

/* Meldungen */
#toast {
  position: fixed; left: 50%; z-index: 70; bottom: calc(env(safe-area-inset-bottom) + var(--tabbar) + var(--tab-gap) + 96px);
  transform: translateX(-50%); width: max-content; max-width: calc(100vw - 32px);
  padding: 12px 18px; border-radius: 14px; background: var(--ink); color: #fff; font-weight: 600;
  opacity: 0; pointer-events: none; transition: opacity 0.2s;
}
#toast.show { opacity: 1; }

/* Dialoge */
dialog { width: min(540px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); overflow: auto; padding: 0; border: 0; border-radius: 22px; background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(11, 27, 63, 0.45); }
dialog form { padding: 22px 20px 20px; }
dialog h2 { margin: 0 0 12px; font-family: var(--display); font-size: 22px; font-weight: 600; line-height: 1.2; }
.dlg-actions { display: grid; gap: 10px; margin-top: 18px; }
.err { color: var(--crit-text); font-weight: 700; }
.err[hidden] { display: none; }
dialog.dark { background: var(--ink); color: #fff; }
dialog.dark .dlg-actions { grid-template-columns: 1fr 1fr; }
dialog.dark .dlg-actions .cancel { order: -1; background: transparent; color: #fff; box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.55); }
dialog.dark p { color: var(--on-ink-muted); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

<main id="main"></main>

<script>
(function () {
'use strict';

// ---------------------------------------------------------------------------
// Konfiguration – Standardwerte (Platzhalter), in den Einstellungen änderbar
// ---------------------------------------------------------------------------
const CONFIG = {
  supplierName: 'WERO',
  orderEmail: 'bestellung@example.invalid',
  internalEmail: 'info@test.de',             // CC
  customerNumber: '[KUNDENNUMMER]',
  deliveryAddress: 'MVVR GmbH\n[Lieferadresse]',
  confirmEmail: '[Bestätigungsadresse]',
  senderPhone: '[Telefon Büro]',
  intervalMonths: 12,
  warnMonths: 3,           // Warnung, wenn eine Position in weniger als 3 Monaten abläuft
  storageAdapter: 'local', // Datenspeicherung: 'local' (dieses Gerät) oder 'api' (Server, noch nicht umgesetzt)
  apiBaseUrl: 'api/'       // nur für 'api'
};
const ORDER_FIELDS = ['supplierName', 'orderEmail', 'internalEmail', 'customerNumber', 'deliveryAddress', 'confirmEmail', 'senderPhone'];

// Alle Datenzugriffe laufen über VKStorage (storage.js). Die Oberfläche hält

const store = VKStorage.create(CONFIG.storageAdapter, { baseUrl: CONFIG.apiBaseUrl });
let data = null;

// Führt eine Speicheraktion aus; bei Fehler Meldung und null
async function persist(task) {
  try {
    return await task();
  } catch (e) {
    toast(e && e.message ? e.message : 'Speichern nicht möglich.');
    return null;
  }
}

async function saveBuilding(b) {
  const saved = await persist(() => store.saveBuilding(b));
  if (saved) b.updatedAt = saved.updatedAt;
  return saved;
}

async function saveFacility(f) {
  const saved = await persist(() => store.saveFacility(f));
  if (saved) {
    f.updatedAt = saved.updatedAt;
    const stamps = new Map(saved.items.map((it) => [it.id, it.updatedAt]));
    f.items.forEach((it) => { it.updatedAt = stamps.get(it.id); });
  }
  return saved;
}

async function saveSettings() {
  const saved = await persist(() => store.saveSettings(data.settings));
  if (saved) data.settings = saved;
  return saved;
}

async function addLog(f, entry) {
  const saved = await persist(() => store.addLogEntry(f.id, entry));
  if (saved) {
    f.log.unshift(saved);
    f.log = f.log.slice(0, VKStorage.LOG_LIMIT);
  }
  return saved;
}

// ---------------------------------------------------------------------------
// Status: 2 = Mangel (Fehlmenge/abgelaufen), 1 = fällig (Prüfung fällig,
// Position läuft bald ab), 0 = in Ordnung. Bestellte Mängel bleiben Mängel,
// werden aber blau als "bestellt" angezeigt.
// ---------------------------------------------------------------------------
function itemState(it) {
  const n = nowIdx();
  const left = it.expiry ? ymIdx(it.expiry) - n : Infinity;
  const expired = left < 0;
  const short = it.actual < it.target;
  const soon = !expired && left < CONFIG.warnMonths;
  return { s: expired || short ? 2 : soon ? 1 : 0, expired, short, soon };
}

const needsOrder = (it) => it.target > 0 && itemState(it).s === 2;
const isPending = (it) => !!it.orderedAt && needsOrder(it);
const orderQty = (it) => (itemState(it).expired ? it.target : it.target - it.actual);
// Bestellmarke entfernen, sobald die Position nicht mehr fehlt
function settle(it) {
  if (it.orderedAt && !needsOrder(it)) { it.orderedAt = null; it.orderRef = ''; }
}

// Prüfung: fällig, wenn nie geprüft, überfällig oder in diesem/nächsten Monat
function dueInfo(f) {
  if (!f.nextCheck) return { s: 1, text: 'Noch nicht geprüft' };
  const left = ymIdx(f.nextCheck) - nowIdx();
  if (left < 0) return { s: 1, text: 'Prüfung überfällig' };
  if (left <= 1) return { s: 1, text: 'Prüfung fällig ' + fmtYm(f.nextCheck) };
  return { s: 0, text: 'Prüfung ' + fmtYm(f.nextCheck) };
}

function facState(f) {
  const due = dueInfo(f);
  let s = due.s, bad = 0, warn = 0, pending = 0;
  for (const it of f.items) {
    const st = itemState(it);
    if (st.s === 2) { bad++; if (isPending(it)) pending++; }
    else if (st.s === 1) warn++;
    s = Math.max(s, st.s);
  }
  return { s, bad, warn, pending, openBad: bad - pending, due };
}

// Statuszeile eines Kastens: { s, text }
function facStatus(f, st = facState(f)) {
  if (st.openBad) return { s: 2, text: plural(st.bad, 'Position fehlt', 'Positionen fehlen') + (st.pending ? ' · ' + st.pending + ' bestellt' : '') };
  if (st.pending) return { s: 3, text: plural(st.pending, 'Position', 'Positionen') + ' bestellt' };
  if (st.due.s) return { s: 1, text: st.due.text };
  if (st.warn) return { s: 1, text: plural(st.warn, 'Position läuft', 'Positionen laufen') + ' bald ab' };
  return { s: 0, text: f.items.length ? 'Vollständig' : 'Keine Positionen' };
}

function countStates(facs) {
  const c = [0, 0, 0];
  facs.forEach((f) => { c[facState(f).s]++; });
  return c;
}

function itemText(it, st) {
  const parts = [];
  if (st.short) parts.push('Fehlt ' + (it.target - it.actual));
  if (st.expired) parts.push('Abgelaufen ' + fmtYm(it.expiry));
  if (st.soon) parts.push('Läuft ab ' + fmtYm(it.expiry));
  if (isPending(it)) parts.push('bestellt am ' + fmtDay(it.orderedAt));
  return parts.length ? parts.join(' · ') : 'Vollständig';
}

// ---------------------------------------------------------------------------
// Bestellung (Mail-Aufbau in order.js)

function orderItems(f) {
  return f.items.filter((it) => needsOrder(it) && !it.orderedAt)
    .map((it) => ({ it, artNo: it.artNo, name: it.name, qty: orderQty(it) }));
}

function orderRooms(facs) {
  return facs.map((f) => ({ f, building: bName(f), room: f.name, items: orderItems(f) })).filter((r) => r.items.length);
}

function orderSettings() {
  const o = {};
  ORDER_FIELDS.forEach((k) => { o[k] = setting(k); });
  return o;
}

function knownRefs() {
  return data.facilities.flatMap((f) => [
    ...f.log.flatMap((e) => (e.ref ? e.ref.split(/,\s*/) : [])),
    ...f.items.map((it) => it.orderRef).filter(Boolean)

}

// buttons: [{ label, value, cls, autofocus }] – der erste Knopf ist die Hauptaktion (Enter)
function dialog({ title, html = '', buttons, validate, onOpen, dark }) {
  return new Promise((resolve) => {
    const list = buttons.filter(Boolean);
    dlg.className = dark ? 'dark' : '';
    dlg.innerHTML = `<form method="dialog" novalidate>
      <h2 id="dlgTitle">${esc(title)}</h2>${html}
      <p class="err" role="alert" hidden></p>
      <div class="dlg-actions">${list.map((b) => `<button type="submit" value="${esc(b.value)}" class="btn ${b.cls || ''}${b.value === 'cancel' ? ' cancel' : ''}"${b.autofocus ? ' autofocus' : ''}>${esc(b.label)}</button>`).join('')}</div>
    </form>`;
    dlg.setAttribute('aria-labelledby', 'dlgTitle');
    const form = $('form', dlg);
    const err = $('.err', form);
    form.addEventListener('submit', (e) => {
      const value = e.submitter ? e.submitter.value : list[0].value;
      if (value !== 'cancel' && validate) {
        const msg = validate(form, value);
        if (msg) { e.preventDefault(); err.textContent = msg; err.hidden = false; return; }
      }
      if (!e.submitter) { e.preventDefault(); dlg.close(value); }
    });
    dlg.addEventListener('close', () => resolve({ value: dlg.returnValue || 'cancel', form }), { once: true });
    dlg.returnValue = '';
    dlg.showModal();
    if (onOpen) onOpen(form);
  });
}

async function confirmDlg(title, text, okLabel, danger) {
  const r = await dialog({
    title,
    html: `<p>${esc(text)}</p>`,
    buttons: [
      { label: okLabel, value: 'ok', cls: danger ? 'ink' : 'primary' },
      { label: 'Abbrechen', value: 'cancel', autofocus: danger }
    ]
  });
  return r.value === 'ok';
}

function alertDlg(title, text) {
  return dialog({ title, html: `<p>${esc(text)}</p>`, buttons: [{ label: 'OK', value: 'ok', cls: 'primary' }] });
}

async function textDlg(title, label, value) {
  const r = await dialog({
    title,
    html: `<div class="field"><label for="dlgText">${esc(label)}</label><input id="dlgText" name="text" autocomplete="off" maxlength="200" value="${esc(value)}"></div>`,
    buttons: [{ label: 'Speichern', value: 'ok', cls: 'primary' }, { label: 'Abbrechen', value: 'cancel' }],
    validate: (form) => (form.text.value.trim() ? '' : 'Bitte einen Namen eingeben.'),
    onOpen: (form) => { form.text.focus(); form.text.select(); }
  });
  return r.value === 'ok' ? r.form.text.value.trim() : null;
}

function expiryFields(current, noExpiry = !current) {
  const [cy, cm] = current ? current.split('-').map(Number) : [0, 0];
  const y0 = new Date().getFullYear() - 3;
  const years = [];
  for (let y = y0; y <= y0 + 15; y++) years.push(y);
  if (cy && !years.includes(cy)) years.unshift(cy);
  return `<fieldset>
    <legend>Haltbar bis (Monat/Jahr)</legend>
    <div class="row2">
      <label>Monat<select name="em"><option value="">–</option>${Array.from({ length: 12 }, (_, i) => `<option value="${i + 1}"${cm === i + 1 ? ' selected' : ''}>${pad(i + 1)}</option>`).join('')}</select></label>
      <label>Jahr<select name="ey"><option value="">–</option>${years.map((y) => `<option value="${y}"${cy === y ? ' selected' : ''}>${y}</option>`).join('')}</select></label>
    </div>
    <label class="check"><input type="checkbox" name="enone"${noExpiry ? ' checked' : ''}> Kein Ablaufdatum</label>
  </fieldset>`;
}

function wireExpiry(form) {
  const uncheck = () => { if (form.em.value || form.ey.value) form.enone.checked = false; };
  form.em.addEventListener('change', uncheck);
  form.ey.addEventListener('change', uncheck);
  form.enone.addEventListener('change', () => { if (form.enone.checked) { form.em.value = ''; form.ey.value = ''; } });
}

// Liefert { error } oder { value } (JJJJ-MM oder null)
function readExpiry(form) {
  if (form.enone.checked) return { value: null };
  const m = Number(form.em.value), y = Number(form.ey.value);
  if (!m || !y) return { error: 'Bitte Monat und Jahr wählen oder „Kein Ablaufdatum“ ankreuzen.' };
  return { value: y + '-' + pad(m) };
}

function templateRadios(selected) {

// ---------------------------------------------------------------------------
function facilityRow(f, withBuilding) {
  const fs = facStatus(f);
  return `<li><a class="row" href="#/e/${esc(f.id)}">
    <span class="row-main">
      <span class="row-title">${esc(f.name)}</span>
      ${withBuilding ? `<span class="meta">${esc(bName(f))}</span>` : ''}
      ${statusHtml(fs.s, fs.text)}
    </span>
    <span class="chev">${ICON.chev}</span>
  </a></li>`;
}

const bySeverity = (list) => list.map((f, i) => {
  const st = facState(f);
  return { f, i, w: st.openBad ? 4 : st.pending ? 3 : st.s === 1 ? 2 : 0 };
}).sort((a, b) => b.w - a.w || a.i - b.i).map((x) => x.f);

// Übersicht: Suche und "Alle" bleiben beim Zurückkehren erhalten
const ov = { q: '', all: false };

function todoList() {
  return bySeverity(data.facilities.filter((f) => { const st = facState(f); return st.s === 2 || st.due.s === 1; }));
}

function overviewList() {
  const q = norm(ov.q.trim());
  if (q) {
    const hits = data.facilities.filter((f) => norm(f.name).includes(q) || norm(bName(f)).includes(q));
    return `<h2 class="section">Suchergebnisse (${hits.length})</h2>
      ${hits.length ? `<ul class="group">${bySeverity(hits).map((f) => facilityRow(f, true)).join('')}</ul>` : '<p class="hint">Keine passenden Kästen gefunden.</p>'}`;
  }
  const todo = todoList();
  const shown = ov.all ? todo : todo.slice(0, 2);
  const todoHtml = todo.length
    ? `<ul class="group">${shown.map((f) => {
      const fs = facStatus(f);
      return `<li><a class="row" href="#/e/${esc(f.id)}">
        <span class="disc s${fs.s}">${fs.s === 3 ? ICON.box : ICON[fs.s]}</span>
        <span class="row-main"><span class="row-title">${esc(f.name)}</span>
          <span class="meta">${esc(bName(f))} · <span class="t s${fs.s}">${esc(fs.text)}</span></span></span>
        <span class="chev">${ICON.chev}</span></a></li>`;
    }).join('')}</ul>`
    : `<ul class="group"><li><div class="row"><span class="disc s0">${ICON[0]}</span><span class="row-main"><span class="row-title">Nichts zu erledigen</span><span class="meta">Alle Kästen einsatzbereit und geprüft</span></span></div></li></ul>`;

  const buildings = data.buildings.map((b) => {
    const c = countStates(facsOf(b.id));
    const n = c[0] + c[1] + c[2];
    let right;
    if (!n) right = '<span class="muted">Keine Kästen</span>';
    else if (!c[1] && !c[2]) right = statusHtml(0, 'Alles ok');
    else {
      right = (c[2] ? `<span class="cnt s2"><span class="dot" aria-hidden="true"></span><span class="num">${c[2]}</span><span class="sr"> mit Mangel</span></span>` : '') +
        (c[1] ? `<span class="cnt s1"><span class="dot" aria-hidden="true"></span><span class="num">${c[1]}</span><span class="sr"> fällig</span></span>` : '');
    }
    return `<li><a class="row" href="#/g/${esc(b.id)}">
      <span class="row-main"><span class="row-title">${esc(b.name)}</span><span class="meta">${kaesten(n)}</span></span>
      <span class="row-right">${right}</span>
      <span class="chev">${ICON.chev}</span></a></li>`;
  }).join('');

  return `<div class="sectionrow"><h2 class="section">Zu erledigen</h2>
      ${todo.length > 2 ? `<button class="linkbtn" type="button" data-act="todoAll" aria-expanded="${ov.all}">${ov.all ? 'Weniger' : 'Alle ' + todo.length}</button>` : ''}</div>
    ${todoHtml}
    <h2 class="section">Gebäude</h2>
    <ul class="group">${buildings}
      <li><button class="row add" type="button" data-act="addBuilding">${ICON.plus}Gebäude anlegen</button></li>
    </ul>`;
}

function refreshOverviewList() {
  $('#ovList').innerHTML = overviewList();
}

function viewOverview() {
  const facs = data.facilities;
  const c = countStates(facs);
  const total = facs.length;
  const ready = c[0] + c[1];
  const next = facs.map((f) => f.nextCheck).filter(Boolean).sort()[0];
  const w = (n) => (total ? (n / total) * 100 : 0).toFixed(2) + '%';
  const date = new Date().toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' });
  return {
    gear: true,
    tab: 'overview',
    kicker: date,
    title: 'Übersicht',
    html: `
      <section class="statuscard" aria-label="Status aller Kästen">
        <div class="sc-top">
          <div>
            <div class="sc-big">${ready}<span class="of"> / ${total}</span></div>
            <p class="sc-label">Kästen einsatzbereit</p>
          </div>
          <div class="sc-side"><span class="num">${data.buildings.length}</span> ${data.buildings.length === 1 ? 'Gebäude' : 'Gebäude'}<br>nächste Prüfung <span class="num">${next ? fmtYm(next) : '–'}</span></div>
        </div>
        <div class="stack" aria-hidden="true">
          ${c[0] ? `<span style="width:${w(c[0])};background:var(--ok-dot)"></span>` : ''}
          ${c[1] ? `<span style="width:${w(c[1])};background:var(--warn-dot)"></span>` : ''}
          ${c[2] ? `<span style="width:${w(c[2])};background:var(--crit-dot)"></span>` : ''}
        </div>
        <ul class="legend">
          <li><span class="dot s0"></span>${c[0]} in Ordnung</li>
          <li><span class="dot s1"></span>${c[1]} fällig</li>
          <li><span class="dot s2"></span>${c[2]} ${c[2] === 1 ? 'Mangel' : 'Mängel'}</li>
        </ul>
      </section>
      ${storageOk ? '' : `<p class="note s1">${ICON[1]}<span>Speichern ist auf diesem Gerät nicht möglich (z. B. privater Modus). Änderungen gehen beim Schließen verloren.</span></p>`}
      ${facs.length ? `<div class="search">${ICON.search}<label class="sr" for="q">Kasten oder Gebäude suchen</label>
        <input id="q" type="search" autocomplete="off" enterkeyhint="search" placeholder="Kasten oder Gebäude suchen" value="${esc(ov.q)}"></div>` : ''}
      <div id="ovList">${overviewList()}</div>`
  };
}

// Gebäude: Segment-Filter
const bf = { id: null, seg: 'alle' };

function buildingList(b) {
  const facs = facsOf(b.id);
  const q = $('#filter') ? norm($('#filter').value.trim()) : '';
  const hits = bySeverity(facs).filter((f) => {
    const s = facState(f).s;
    const segOk = bf.seg === 'alle' || (bf.seg === 'offen' ? s > 0 : s === 0);
    return segOk && (!q || norm(f.name).includes(q));
  });
  return hits.length ? `<ul class="group">${hits.map((f) => facilityRow(f)).join('')}</ul>` : '<p class="hint">Keine passenden Kästen.</p>';
}

function viewBuilding(b) {
  if (bf.id !== b.id) { bf.id = b.id; bf.seg = 'alle'; }
  const facs = facsOf(b.id);
  const c = countStates(facs);
  const sub = [kaesten(facs.length)];
  if (c[2]) sub.push(plural(c[2], 'Mangel', 'Mängel'));
  if (c[1]) sub.push(c[1] + ' fällig');
  const seg = (v, label, n) => `<button type="button" data-act="bseg" data-v="${v}" aria-pressed="${bf.seg === v}"><span>${label} · ${n}</span></button>`;
  const lines = VKOrder.sumItems(orderRooms(facs).flatMap((r) => r.items));
  return {
    back: '#/',
    backLabel: 'Übersicht',
    tab: 'overview',
    title: b.name,
    sub: esc(sub.join(' · ')),
    action: facs.length ? `<a class="btn primary split" href="#/bestellung/g/${esc(b.id)}"><span>Bestellen für ${esc(b.name)}</span><span class="extra">${plural(lines.length, 'Artikel', 'Artikel')}</span></a>` : '',
    html: `
      ${facs.length ? `<div class="seg" role="group" aria-label="Kästen filtern">${seg('alle', 'Alle', facs.length)}${seg('offen', 'Offen', c[1] + c[2])}${seg('ok', 'In Ordnung', c[0])}</div>` : ''}
      ${facs.length >= 5 ? `<div class="search" style="margin:0 0 16px">${ICON.search}<label class="sr" for="filter">Kästen filtern</label>
        <input id="filter" type="search" autocomplete="off" enterkeyhint="search" placeholder="Kästen filtern"></div>` : ''}
      <div id="bList">${facs.length ? buildingList(b) : '<p class="hint">Noch keine Kästen in diesem Gebäude.</p>'}</div>
      <h2 class="section">Verwalten</h2>
      <ul class="group">
        <li><button class="row add" type="button" data-act="addFacility">${ICON.plus}Kasten anlegen</button></li>
        <li><button class="row" type="button" data-act="renameBuilding"><span class="row-main">Gebäude umbenennen</span><span class="chev">${ICON.chev}</span></button></li>
        <li><button class="row" type="button" data-act="deleteBuilding"><span class="row-main">Gebäude löschen</span><span class="chev">${ICON.chev}</span></button></li>
      </ul>`
  };
}

function itemRow(it) {
  const st = itemState(it);
  const id = esc(it.id);
  const name = esc(it.name);
  const s = isPending(it) ? 3 : st.s;
  return `<li class="item">
    <div class="item-top">
      <button class="item-name" type="button" data-act="editItem" data-id="${id}">
        <span class="nm">${name}<span class="sr"> – bearbeiten</span></span>
        <span class="meta">${esc(it.artNo || 'ohne Art.-Nr.')} · ${it.expiry ? 'haltbar bis ' + fmtYm(it.expiry) : 'ohne Ablaufdatum'}</span>
      </button>
      <div class="stepper" role="group" aria-label="Istmenge ${name}">
        <button class="sbtn" type="button" data-act="dec" data-id="${id}" aria-label="Eins weniger: ${name}"${it.actual <= 0 ? ' disabled' : ''}>${ICON.minus}</button>
        <span class="sval num">${it.actual}<small>/${it.target}</small><span class="sr"> vorhanden</span></span>
        <button class="sbtn" type="button" data-act="inc" data-id="${id}" aria-label="Eins mehr: ${name}"${it.actual >= 999 ? ' disabled' : ''}>${ICON.plus}</button>
      </div>
    </div>
    <div class="item-bottom">${dotStatus(s, itemText(it, st))}
      ${st.s === 2 ? `<button class="btn small ord" type="button" data-act="refill" data-id="${id}">Aufgefüllt<span class="sr"> – ${name}</span></button>` : ''}
    </div>
  </li>`;
}

function viewFacility(f) {
  const st = facState(f);
  const n = f.items.length;
  const pending = f.items.filter(isPending);
  const sub = [esc(tplName(f.template)), f.lastCheck ? 'zuletzt geprüft ' + fmtYm(f.lastCheck.slice(0, 7)) : 'noch nicht geprüft'];
  if (st.due.s) sub.push(`<span class="t s1">${esc(st.due.text)}</span>`);
  let orderCard = '';
  if (pending.length) {
    const dates = [...new Set(pending.map((it) => it.orderedAt))].sort();
    const refs = [...new Set(pending.map((it) => it.orderRef).filter(Boolean))];
    orderCard = `<section class="ordercard" aria-label="Offene Bestellung">
      <div class="oc-main"><span class="disc">${ICON.box}</span>
        <div><div class="row-title">${plural(pending.length, 'Position', 'Positionen')} bestellt</div>
        <div class="meta">am ${dates.map(fmtDay).join(', ')}${refs.length ? ' · Ref. ' + esc(refs.join(', ')) : ''}</div></div></div>
      <button class="btn small" type="button" data-act="delivered">Lieferung eingeräumt</button>
    </section>`;
  }
  return {
    back: '#/g/' + f.buildingId,
    backLabel: bName(f) || 'Gebäude',
    topRight: `<a class="toplink" href="#/e/${esc(f.id)}/protokoll">Protokoll</a>`,
    tab: 'overview',
    title: f.name,
    sub: sub.join(' · '),
    action: '<button class="btn primary" type="button" data-act="finish">Prüfung abschließen</button>',
    html: `
      <p class="progress"><span class="num">${n - st.bad}</span> von <span class="num">${n}</span> vollständig${st.bad ? ` · <span class="t s2">${st.bad} fehlen</span>` : ''}</p>
      ${f.inspectionOpen ? '<p class="hint" style="margin-top:2px">Prüfung läuft – Eingaben sind gespeichert.</p>' : ''}
      ${orderCard}
      <h2 class="caps">Inhalt</h2>
      <ul class="group">${f.items.map(itemRow).join('')}
        <li><button class="row add" type="button" data-act="addItem">${ICON.plus}Position hinzufügen</button></li>
      </ul>
      ${f.template !== 'leer' ? '<p class="hint">Vorlage vor dem Einsatz mit dem aktuellen Normblatt und der Lieferantenliste abgleichen.</p>' : ''}
      <h2 class="section">Verwalten</h2>
      <ul class="group">
        <li><a class="row" href="#/bestellung/e/${esc(f.id)}"><span class="row-main">Nur diesen Kasten bestellen</span><span class="chev">${ICON.chev}</span></a></li>
        <li><button class="row" type="button" data-act="renameFacility"><span class="row-main">Kasten umbenennen</span><span class="chev">${ICON.chev}</span></button></li>
        <li><button class="row" type="button" data-act="changeTemplate"><span class="row-main">Vorlage wechseln / neu laden</span><span class="chev">${ICON.chev}</span></button></li>
        <li><button class="row" type="button" data-act="deleteFacility"><span class="row-main">Kasten löschen</span><span class="chev">${ICON.chev}</span></button></li>
      </ul>`
  };
}

function viewLog(f) {
  const list = (arr) => (arr.length ? `<ul>${arr.map((x) => `<li>${esc(x.name)}${x.artNo ? ' (' + esc(x.artNo) + ')' : ''}: ${esc(x.reason)}</li>`).join('')}</ul>` : '');
  const entry = (e) => {
    let s, text;
    if (e.type === 'bestellung') { s = 3; text = 'Bestellt' + (e.ref ? ' – Ref. ' + e.ref : ''); }
    else if (e.type === 'lieferung') { s = 0; text = 'Lieferung eingeräumt' + (e.ref ? ' – Ref. ' + e.ref : ''); }
    else if (e.result === 'ok') { s = 0; text = 'Prüfung – in Ordnung'; }
    else { s = 2; text = 'Prüfung – Mängel: ' + plural(e.issues.length, 'Fehlposition', 'Fehlpositionen'); }
    return `<li><div class="row" style="display:block">
      <div class="row-title">${fmtDate(e.date)}</div>
      ${statusHtml(s === 3 ? 3 : s, text)}
      ${list(e.issues)}${e.notes.length ? '<div class="meta">Hinweise:</div>' + list(e.notes) : ''}
    </div></li>`;
  };
  return {
    back: '#/e/' + f.id,
    backLabel: f.name,
    tab: 'overview',
    title: 'Protokoll',
    sub: esc(bName(f) + ' – ' + f.name),
    html: f.log.length ? `<ul class="group log-list">${f.log.map(entry).join('')}</ul>` : '<p class="hint">Noch keine Einträge.</p>'
  };
}

let orderCtx = null;

function viewOrder(scope, id) {
  let facs, sub, back = '', backLabel = '';
  if (scope === 'e') {
    const f = fById(id);
    if (!f) return null;
    facs = [f];
    sub = bName(f) + ' – ' + f.name;
    back = '#/e/' + f.id;
    backLabel = f.name;
  } else if (scope === 'g') {
    const b = bById(id);
    if (!b) return null;
    facs = facsOf(b.id);
    sub = b.name + ' · ' + kaesten(facs.length);
  } else if (scope === 'alle') {
    facs = data.facilities;
    sub = 'Alle Gebäude · ' + kaesten(facs.length);
  } else {
    return null;
  }

  // Umfang wählen: Segment (bis 3 Gebäude) oder Auswahlliste
  let picker = '';
  if (scope !== 'e' && data.buildings.length) {
    const cur = scope === 'g' ? id : '';
    if (data.buildings.length <= 3) {
      const seg = (href, label, on) => `<a href="${href}"${on ? ' aria-current="page"' : ''}><span>${esc(label)}</span></a>`;
      picker = `<nav class="seg" aria-label="Umfang">${seg('#/bestellung/alle', 'Gesamt', !cur)}${data.buildings.map((b) => seg('#/bestellung/g/' + esc(b.id), b.name, cur === b.id)).join('')}</nav>`;
    } else {
      picker = `<div class="field" style="margin:16px 0"><label for="scopeSel">Umfang</label><select id="scopeSel">
        <option value="#/bestellung/alle"${!cur ? ' selected' : ''}>Gesamt</option>
        ${data.buildings.map((b) => `<option value="#/bestellung/g/${esc(b.id)}"${cur === b.id ? ' selected' : ''}>${esc(b.name)}</option>`).join('')}</select></div>`;
    }
  }

  const rooms = orderRooms(facs);
  const pendingN = facs.reduce((s, f) => s + f.items.filter(isPending).length, 0);
  const pendingNote = pendingN ? `<p class="hint">${plural(pendingN, 'Position ist', 'Positionen sind')} bereits bestellt und erscheint hier nicht.</p>` : '';
  const base = { back, backLabel, gear: false, tab: 'order', title: 'Bestellung', sub: esc(sub) };

  if (!rooms.length) {
    orderCtx = null;
    return Object.assign(base, {
      html: `${picker}<ul class="group"><li><div class="row"><span class="disc s0">${ICON[0]}</span>
        <span class="row-main"><span class="row-title">Nichts zu bestellen</span><span class="meta">Keine fehlenden oder abgelaufenen Positionen</span></span></div></li></ul>${pendingNote}`
    });
  }

  const ref = VKOrder.nextOrderRef(knownRefs());
  const mail = VKOrder.buildOrderMail({
    rooms: rooms.map((r) => ({ building: r.building, room: r.room, items: r.items.map(({ artNo, name, qty }) => ({ artNo, name, qty })) })),
    settings: orderSettings(),
    ref
  });
  orderCtx = { ref, rooms, mail };
  const pieces = mail.totals.reduce((s, it) => s + it.qty, 0);
  const missing = ['orderEmail', 'customerNumber', 'deliveryAddress', 'confirmEmail', 'senderPhone', 'internalEmail'].filter((k) => !settings()[k]);
  const labels = { orderEmail: 'Bestelladresse', customerNumber: 'Kundennummer', deliveryAddress: 'Lieferadresse', confirmEmail: 'Bestätigungsadresse', senderPhone: 'Telefon', internalEmail: 'interne Kopie (CC)' };

  return Object.assign(base, {
    action: mail.tooLong
      ? `<button class="btn primary" type="button" disabled>${ICON.mail}Bestell-E-Mail erstellen</button>`
      : `<a class="btn primary" href="${esc(mail.href)}" data-act="sendMail">${ICON.mail}Bestell-E-Mail erstellen</a>`,
    html: `${picker}
      <ul class="group">
        ${mail.totals.map((it) => `<li><div class="row">
          <span class="row-main"><span class="row-title">${esc(it.name)}</span><span class="meta">${esc(it.artNo || 'ohne Art.-Nr.')}</span></span>
          <span class="oqty"><span class="num">${it.qty}</span><small>Stk.</small></span></div></li>`).join('')}
        <li class="foot">${plural(mail.totals.length, 'Artikel', 'Artikel')} · ${pieces} Teile gesamt</li>
      </ul>
      ${mail.tooLong ? `<p class="note s1">${ICON[1]}<span>Bestellung zu lang – bitte pro Gebäude bestellen.</span></p>` : ''}
      ${missing.length ? `<p class="note s1">${ICON[1]}<span>Noch Platzhalter in den Einstellungen: ${esc(missing.map((k) => labels[k]).join(', '))}.</span></p>` : ''}
      ${pendingNote}
      ${rooms.length > 1 ? `<details class="group" style="margin-top:16px">
        <summary>Verteilliste nach Standort (${rooms.length})${ICON.down}</summary>
        <div class="dist">
          <p class="hint" style="margin:12px 0 0">Zum Auffüllen nach der Lieferung.</p>
          ${mail.split.map((b) => `<h3>${esc(b.building)}</h3>${b.rooms.map((r) => {
            const f = rooms.find((x) => x.building === r.building && x.room === r.room).f;
            return `<h4><a href="#/e/${esc(f.id)}">${esc(r.room)}</a></h4><ul>${r.items.map((it) => `<li><span class="num">${it.qty}</span> Stk. · ${esc(it.artNo || '–')} · ${esc(it.name)}</li>`).join('')}</ul>`;
          }).join('')}`).join('')}
        </div>
      </details>` : ''}
      <ul class="group" style="margin-top:16px"><li><button class="row" type="button" data-act="copyMail">${ICON.copy}<span class="row-main">E-Mail-Text kopieren</span></button></li></ul>
      <p class="hint">Ref. ${esc(ref)} · Die E-Mail wird erst in der Mail-App gesendet.</p>`
  });
}

function viewSettings() {
  const s = settings();
  const fieldRow = (k, label, type = 'text', extra = '') => `<li class="formrow"><label for="set_${k}">${label}</label>
    ${type === 'textarea'
      ? `<textarea id="set_${k}" name="${k}" rows="3" maxlength="1000" placeholder="${esc(CONFIG[k])}">${esc(s[k] || '')}</textarea>`
      : `<input id="set_${k}" name="${k}" type="${type}" autocomplete="off" ${extra} value="${esc(s[k] || '')}" placeholder="${esc(CONFIG[k])}">`}</li>`;
  const mailAttrs = 'inputmode="email" autocapitalize="off" spellcheck="false" maxlength="254"';
  return {
    back: '#/',
    backLabel: 'Übersicht',
    tab: 'overview',
    title: 'Einstellungen',
    html: `
      <h2 class="section">Bestellung</h2>
      <form id="formOrder" novalidate>
        <ul class="group">
          ${fieldRow('supplierName', 'Lieferant', 'text', 'maxlength="100"')}
          ${fieldRow('orderEmail', 'Bestelladresse (E-Mail)', 'email', mailAttrs)}
          ${fieldRow('internalEmail', 'Kopie intern (CC)', 'email', mailAttrs)}
          ${fieldRow('customerNumber', 'Kundennummer', 'text', 'maxlength="60"')}
          ${fieldRow('deliveryAddress', 'Lieferadresse', 'textarea')}
          ${fieldRow('confirmEmail', 'Auftragsbestätigung an (E-Mail)', 'email', mailAttrs)}
          ${fieldRow('senderPhone', 'Telefon Büro', 'tel', 'maxlength="60"')}
        </ul>
        <p class="hint">Leere Felder verwenden den angezeigten Platzhalter.</p>
        <div class="actions"><button class="btn primary" type="submit">Bestelldaten speichern</button></div>
      </form>
      <h2 class="section">Prüfung</h2>
      <form id="formInterval" novalidate>
        <ul class="group"><li class="formrow"><label for="sInt">Prüfintervall in Monaten</label>
          <input id="sInt" type="number" inputmode="numeric" pattern="[0-9]*" min="1" max="60" value="${intervalMonths()}"></li></ul>
        <p class="hint">Standard: ${CONFIG.intervalMonths} Monate. Gilt ab der nächsten abgeschlossenen Prüfung.</p>
        <div class="actions"><button class="btn" type="submit">Intervall speichern</button></div>
      </form>
      <h2 class="section">Datensicherung</h2>
      <p class="note s1" style="margin:0 0 12px">${ICON[1]}<span>Daten liegen nur auf diesem Gerät – regelmäßig exportieren. App nicht vom Home-Bildschirm löschen, ohne vorher zu exportieren.</span></p>
      <ul class="group">

        <li><div class="row"><span class="row-main">Bestand</span><span class="row-right">${plural(data.buildings.length, 'Gebäude', 'Gebäude')} · ${kaesten(data.facilities.length)}</span></div></li>

// ---------------------------------------------------------------------------
// Navigation
// ---------------------------------------------------------------------------
let view = null;

function route() {
  const p = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean).map(decodeURIComponent);
  if (!p.length) return viewOverview();
  if (p[0] === 'g') { const b = bById(p[1]); return b ? viewBuilding(b) : null; }
  if (p[0] === 'e') { const f = fById(p[1]); return !f ? null : p[2] === 'protokoll' ? viewLog(f) : viewFacility(f); }
  if (p[0] === 'bestellung') return viewOrder(p[1], p[2]);
  if (p[0] === 'einstellungen') return viewSettings();
  return null;
}

function render() {
  if (!data) return; // noch nicht geladen
  const v = route();
  if (!v) { location.replace('#/'); return; }
  view = v;
  head.innerHTML = headHtml(v);
  main.innerHTML = v.html;
  action.innerHTML = v.action || '';
  action.hidden = !v.action;
  document.body.classList.toggle('has-action', !!v.action);
  for (const [el, tab] of [[$('#tabOverview'), 'overview'], [$('#tabOrder'), 'order']]) {
    if (v.tab === tab) el.setAttribute('aria-current', 'page');
    else el.removeAttribute('aria-current');
  }
}

// Neu zeichnen, Scrollposition halten, Fokus auf ein Element setzen
function rerender(focusSel) {
  const y = window.scrollY;
  render();
  window.scrollTo(0, y);
  if (focusSel) {
    let el = document.querySelector(focusSel);
    if (el && el.disabled) el = el.parentElement.querySelector('button:not(:disabled)');
    if (el) el.focus({ preventScroll: true });
  }
}

function navigate() {
  render();
  window.scrollTo(0, 0);
  const t = $('#title');
  if (t) t.focus({ preventScroll: true });
}

window.addEventListener('hashchange', navigate);

const currentFacility = () => {
  const m = location.hash.match(/^#\/e\/([^/]+)/);
  return m ? fById(decodeURIComponent(m[1])) : null;
};
const currentBuilding = () => {
  const m = location.hash.match(/^#\/g\/([^/]+)/);
  return m ? bById(decodeURIComponent(m[1])) : null;
};

}

async function renameFacility(f) {

  await saveFacility(f);

async function deleteFacility(f) {

async function changeTemplate(f) {
  const r = await dialog({
    title: 'Vorlage wechseln',
    html: `<p class="note s1">${ICON[1]}<span>Alle Positionen dieses Kastens werden durch die Vorlage ersetzt. Mengen, Haltbarkeiten und Bestellmarken gehen verloren. Das Protokoll bleibt.</span></p>
      ${templateRadios(f.template)}`,
    buttons: [{ label: 'Positionen ersetzen', value: 'ok', cls: 'ink' }, { label: 'Abbrechen', value: 'cancel', autofocus: true }]
  });
  if (r.value !== 'ok') return;
  f.template = r.form.tpl.value || 'leer';

function markOpen(f) {
  f.inspectionOpen = true;
}

async function changeQty(f, it, delta) {
  const next = Math.min(999, Math.max(0, it.actual + delta));
  if (next === it.actual) return;
  it.actual = next;
  settle(it);
  markOpen(f);
  rerender(`[data-act="${delta > 0 ? 'inc' : 'dec'}"][data-id="${it.id}"]`);
  announce(`${it.name}: ${it.actual} von ${it.target}`);
  await saveFacility(f);
}

async function itemDlg(f, it) {
  const isNew = !it;
  const cur = it || { name: '', artNo: '', target: 1, actual: 0, expiry: null };
  const r = await dialog({
    title: isNew ? 'Neue Position' : 'Position bearbeiten',
    html: `<div class="field"><label for="iName">Bezeichnung</label><input id="iName" name="iname" autocomplete="off" maxlength="200" value="${esc(cur.name)}"></div>
      <div class="field"><label for="iArt">Artikelnummer</label><input id="iArt" name="iart" autocomplete="off" autocapitalize="characters" maxlength="60" value="${esc(cur.artNo)}" placeholder="z. B. ART-0099"></div>
      <div class="row2">
        <div class="field"><label for="iTarget">Sollmenge</label><input id="iTarget" name="itarget" type="number" inputmode="numeric" pattern="[0-9]*" min="0" max="999" value="${cur.target}"></div>
        <div class="field"><label for="iActual">Istmenge</label><input id="iActual" name="iactual" type="number" inputmode="numeric" pattern="[0-9]*" min="0" max="999" value="${cur.actual}"></div>
      </div>
      ${expiryFields(cur.expiry)}`,
    buttons: [
      { label: 'Speichern', value: 'ok', cls: 'primary' },
      isNew ? null : { label: 'Position löschen', value: 'delete' },
      { label: 'Abbrechen', value: 'cancel' }
    ],
    validate: (form, value) => {
      if (value === 'delete') return '';
      if (!form.iname.value.trim()) return 'Bitte eine Bezeichnung eingeben.';
      for (const [field, label] of [[form.itarget, 'Sollmenge'], [form.iactual, 'Istmenge']]) {
        const n = Number(field.value);
        if (field.value === '' || !Number.isInteger(n) || n < 0 || n > 999) return label + ': bitte eine ganze Zahl von 0 bis 999 eingeben.';
      }
      return readExpiry(form).error || '';
    },
    onOpen: (form) => { wireExpiry(form); if (isNew) form.iname.focus(); }
  });
  if (r.value === 'delete') {
    if (await confirmDlg('Position löschen?', `„${cur.name}“ wird aus diesem Kasten entfernt.`, 'Löschen', true)) {
      f.items = f.items.filter((x) => x !== it);
      markOpen(f);
      await saveFacility(f);
      rerender();
    }
    return;
  }
  if (r.value !== 'ok') return;
  const form = r.form;
  const target = isNew ? { id: uid(), orderedAt: null, orderRef: '' } : it;
  target.name = form.iname.value.trim();
  target.artNo = form.iart.value.trim();
  target.target = Number(form.itarget.value);
  target.actual = Number(form.iactual.value);
  target.expiry = readExpiry(form).value;
  settle(target);
  if (isNew) f.items.push(target);
  markOpen(f);
  await saveFacility(f);
  rerender(`[data-act="editItem"][data-id="${target.id}"]`);
}

// Neues Ablaufdatum abfragen. Liefert { value: 'ok', expiry } | { value: 'skip' } | { value: 'cancel' }
async function expiryAsk(it, { title, intro, skipLabel, cancelLabel }) {
  const r = await dialog({
    title,
    html: `<p><strong>${esc(it.name)}</strong><span class="meta">${esc(it.artNo || 'ohne Art.-Nr.')}</span></p>
      ${intro ? `<p>${intro}</p>` : ''}
      <p>Haltbarkeit des neuen Materials eintragen:</p>
      ${expiryFields(null, !it.expiry)}`,
    buttons: [
      { label: 'Speichern', value: 'ok', cls: 'primary' },
      skipLabel ? { label: skipLabel, value: 'skip' } : null,
      cancelLabel ? { label: cancelLabel, value: 'cancel' } : null
    ],
    validate: (form, value) => (value === 'ok' ? readExpiry(form).error || '' : ''),
    onOpen: wireExpiry
  });
  return r.value === 'ok' ? { value: 'ok', expiry: readExpiry(r.form).value } : { value: r.value };
}

// Einzelne Position aufgefüllt: Ist = Soll, neues Ablaufdatum
async function refill(f, it) {
  const r = await expiryAsk(it, { title: 'Aufgefüllt', intro: `Istmenge wird auf die Sollmenge <strong>${it.target}</strong> gesetzt (bisher ${it.actual}).`, cancelLabel: 'Abbrechen' });
  if (r.value !== 'ok') return;
  it.actual = Math.max(it.actual, it.target);
  it.expiry = r.expiry;
  settle(it);
  if (await saveFacility(f)) toast('Aufgefüllt: ' + it.name);
  rerender(`[data-act="editItem"][data-id="${it.id}"]`);
}

// Lieferung eingeräumt: alle offen bestellten Positionen dieses Kastens
async function delivered(f) {
  const list = f.items.filter(isPending);
  if (!list.length) return;
  const n = list.length;
  const c = await dialog({
    dark: true,
    title: plural(n, 'Position', 'Positionen') + ' als aufgefüllt markieren?',
    html: '<p>Danach fragt die App nach dem neuen Ablaufdatum.</p>',
    buttons: [{ label: 'Bestätigen', value: 'ok', cls: 'primary' }, { label: 'Abbrechen', value: 'cancel', autofocus: true }]
  });
  if (c.value !== 'ok') return;
  const refs = [...new Set(list.map((it) => it.orderRef).filter(Boolean))];
  list.forEach((it) => { it.actual = Math.max(it.actual, it.target); });
  for (let i = 0; i < n; i++) {
    const r = await expiryAsk(list[i], { title: `Ablaufdatum (${i + 1} von ${n})`, skipLabel: 'Datum unverändert lassen' });
    if (r.value === 'ok') list[i].expiry = r.expiry;
  }
  list.forEach((it) => { it.orderedAt = null; it.orderRef = ''; });
  if (!(await saveFacility(f))) return;
  await addLog(f, {
    type: 'lieferung', date: todayIso(), ref: refs.join(', '),
    issues: list.map((it) => ({ name: it.name, artNo: it.artNo, reason: 'aufgefüllt' })), notes: []
  });
  toast(plural(n, 'Position', 'Positionen') + ' aufgefüllt.');
  rerender();
}

async function finish(f) {
  const issues = [], notes = [];
  for (const it of f.items) {
    const st = itemState(it);
    const reasons = [];
    if (st.short) reasons.push('Fehlmenge ' + (it.target - it.actual));
    if (st.expired) reasons.push('abgelaufen ' + fmtYm(it.expiry));
    if (isPending(it)) reasons.push('bestellt');
    if (reasons.length && st.s === 2) issues.push({ name: it.name, artNo: it.artNo, reason: reasons.join(', ') });
    else if (st.soon) notes.push({ name: it.name, artNo: it.artNo, reason: 'läuft ab ' + fmtYm(it.expiry) });
  }
  const next = idxYm(nowIdx() + intervalMonths());
  const list = (arr) => `<ul>${arr.map((x) => `<li>${esc(x.name)}: ${esc(x.reason)}</li>`).join('')}</ul>`;
  const r = await dialog({
    title: 'Prüfung abschließen',
    html: `<p>${statusHtml(issues.length ? 2 : 0, issues.length ? 'Mängel – ' + plural(issues.length, 'Fehlposition', 'Fehlpositionen') : 'In Ordnung')}</p>
      ${issues.length ? list(issues) : ''}
      ${notes.length ? `<p>${plural(notes.length, 'Position läuft', 'Positionen laufen')} bald ab:</p>${list(notes)}` : ''}
      <p>Nächste Prüfung: <strong>${fmtYmLong(next)}</strong> (in ${plural(intervalMonths(), 'Monat', 'Monaten')})</p>`,
    buttons: [
      { label: 'Prüfung abschließen', value: 'ok', cls: 'primary' },
      issues.length ? { label: 'Abschließen und Bestellung öffnen', value: 'order' } : null,
      { label: 'Abbrechen', value: 'cancel' }
    ]
  });
  if (r.value === 'cancel') return;
  const entry = await addLog(f, { type: 'pruefung', date: todayIso(), result: issues.length ? 'maengel' : 'ok', issues, notes });
  if (!entry) return;
  f.lastCheck = todayIso();
  f.nextCheck = next;
  f.inspectionOpen = false;
  if (!(await saveFacility(f))) return;
  toast('Prüfung gespeichert. Nächste Prüfung: ' + fmtYmLong(next));
  if (r.value === 'order') location.hash = '#/bestellung/e/' + f.id;
  else rerender();
}

// Nach dem Öffnen der Mail-App: abgeschickt? → Positionen als bestellt markieren
async function askSent(ctx) {
  const n = ctx.rooms.reduce((s, r) => s + r.items.length, 0);
  const r = await dialog({
    title: 'Bestellung abgeschickt?',
    html: `<p>Ref. ${esc(ctx.ref)} · ${plural(n, 'Position', 'Positionen')}</p>
      <p class="muted">Bei „Ja“ werden die Positionen als bestellt markiert und erscheinen erst nach dem Auffüllen wieder in der Bestellung.</p>`,
    buttons: [{ label: 'Ja', value: 'ok', cls: 'primary' }, { label: 'Nein', value: 'cancel' }]
  });
  if (r.value !== 'ok') return;
  const date = todayIso();
  for (const room of ctx.rooms) {
    room.items.forEach(({ it }) => { it.orderedAt = date; it.orderRef = ctx.ref; });
    if (!(await saveFacility(room.f))) return;
    await addLog(room.f, {
      type: 'bestellung', date, ref: ctx.ref,
      issues: room.items.map(({ it, qty }) => ({ name: it.name, artNo: it.artNo, reason: qty + ' Stk. bestellt' })), notes: []
    });
  }
  toast(plural(n, 'Position', 'Positionen') + ' als bestellt markiert.');
  rerender();
}

async function copyMail() {
  if (!orderCtx) return;
  const m = orderCtx.mail;
  const text = 'An: ' + m.to + '\nCC: ' + m.cc + '\nBetreff: ' + m.subject + '\n\n' + m.body;
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand && document.execCommand('copy');
    ta.remove();
    if (!ok) { toast('Kopieren nicht möglich.'); return; }
  }
  toast('Text kopiert.');
}

async function exportData() {
  const name = 'verbandskasten-' + todayIso() + '.json';
  const dump = await persist(() => store.exportAll());
  if (!dump) return;
  const json = JSON.stringify(dump, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  let shared = false;
  try {
    const file = new File([blob], name, { type: 'application/json' });
    if (matchMedia('(pointer: coarse)').matches && navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: name });
      shared = true;
    }
  } catch (e) {
    if (e && e.name === 'AbortError') return;
  }
  if (!shared) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  }
  settings().lastExport = todayIso();
  await saveSettings();
  toast('Export erstellt: ' + name);
  rerender();
}

async function importData(file) {
  let parsed, incoming;
  try {
    const text = await file.text();
    try { parsed = JSON.parse(text); } catch (e) { throw new Error('Die Datei ist keine gültige JSON-Datei.'); }
    incoming = VKStorage.validate(parsed);
  } catch (e) {
    await alertDlg('Import nicht möglich', e.message || 'Die Datei konnte nicht gelesen werden.');
    return;
  }
  const r = await dialog({
    title: 'Daten importieren',
    html: `<p>Die Datei enthält ${plural(incoming.buildings.length, 'Gebäude', 'Gebäude')} und ${kaesten(incoming.facilities.length)}.</p>
      <p><strong>Zusammenführen:</strong> Gebäude und Kästen aus der Datei werden ergänzt. Bei gleichen Einträgen gewinnt der neuere Stand (Zeitstempel der letzten Änderung). Protokolle werden zusammengeführt. Einstellungen bleiben.</p>
      <p><strong>Ersetzen:</strong> Alle Daten auf diesem Gerät werden gelöscht und durch die Datei ersetzt – auch die Einstellungen.</p>`,
    buttons: [
      { label: 'Zusammenführen', value: 'merge', cls: 'primary' },
      { label: 'Alles ersetzen', value: 'replace' },
      { label: 'Abbrechen', value: 'cancel', autofocus: true }
    ]
  });
  if (r.value === 'cancel') return;
  if (r.value === 'replace') {
    const ok = await confirmDlg('Wirklich alles ersetzen?',
      'Alle Gebäude, Kästen, Protokolle und Einstellungen auf diesem Gerät werden überschrieben. Vorher exportieren wird empfohlen.',
      'Ja, alles ersetzen', true);
    if (!ok) return;
  }
  const result = await persist(() => store.importAll(parsed, r.value));
  if (!result) return;
  data = result;
  toast('Import abgeschlossen.');
  rerender();
}

async function saveOrderSettings(form) {
  const val = (k) => form.elements[k].value.trim();
  const bad = ['orderEmail', 'internalEmail'].filter((k) => val(k) && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val(k)));
  if (val('confirmEmail') && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val('confirmEmail'))) bad.push('confirmEmail');
  if (bad.length) {
    await alertDlg('E-Mail-Adresse prüfen', 'Bitte gültige E-Mail-Adressen eingeben oder das Feld leer lassen.');
    return;
  }
  ORDER_FIELDS.forEach((k) => { settings()[k] = val(k) || null; });
  if (await saveSettings()) toast('Bestelldaten gespeichert.');
  rerender();
}

async function saveInterval(form) {
  const n = Number(form.sInt.value);
  if (!Number.isInteger(n) || n < 1 || n > 60) {
    await alertDlg('Prüfintervall prüfen', 'Bitte eine ganze Zahl von 1 bis 60 Monaten eingeben.');
    return;
  }
  settings().intervalMonths = n;
  if (await saveSettings()) toast('Prüfintervall gespeichert: ' + plural(n, 'Monat', 'Monate'));
  rerender();
}

// Klicks in Inhalt und fixiertem Hauptknopf
function onClick(e) {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  const f = currentFacility();
  const b = currentBuilding();
  const it = f && el.dataset.id ? itById(f, el.dataset.id) : null;
  switch (act) {
    case 'todoAll': ov.all = !ov.all; return refreshOverviewList();
    case 'bseg': bf.seg = el.dataset.v; return b && rerender(`[data-act="bseg"][data-v="${bf.seg}"]`);
    case 'addBuilding': return addBuilding();
    case 'renameBuilding': return b && renameBuilding(b);
    case 'deleteBuilding': return b && deleteBuilding(b);
    case 'addFacility': return b && addFacility(b);
    case 'renameFacility': return f && renameFacility(f);
    case 'deleteFacility': return f && deleteFacility(f);
    case 'changeTemplate': return f && changeTemplate(f);
    case 'inc': return it && changeQty(f, it, 1);
    case 'dec': return it && changeQty(f, it, -1);
    case 'editItem': return it && itemDlg(f, it);
    case 'addItem': return f && itemDlg(f, null);
    case 'refill': return it && refill(f, it);
    case 'delivered': return f && delivered(f);
    case 'finish': return f && finish(f);
    case 'sendMail': {
      // Link öffnet die Mail-App; danach fragen, ob abgeschickt wurde
      const ctx = orderCtx;
      if (ctx) setTimeout(() => askSent(ctx), 600);
      return;
    }
    case 'copyMail': return copyMail();
    case 'export': return exportData();
    case 'import': return $('#importFile').click();
  }
}
main.addEventListener('click', onClick);
action.addEventListener('click', onClick);

main.addEventListener('input', (e) => {
  if (e.target.id === 'q') { ov.q = e.target.value; refreshOverviewList(); }
  else if (e.target.id === 'filter') { const b = currentBuilding(); if (b) $('#bList').innerHTML = buildingList(b); }
});

main.addEventListener('change', (e) => {
  if (e.target.id === 'importFile' && e.target.files && e.target.files[0]) {
    const file = e.target.files[0];
    e.target.value = '';
    importData(file);
  } else if (e.target.id === 'scopeSel') {
    location.hash = e.target.value;
  }
});

main.addEventListener('submit', (e) => {
  e.preventDefault();
  if (e.target.id === 'formOrder') saveOrderSettings(e.target);
  else if (e.target.id === 'formInterval') saveInterval(e.target);
});

// ---------------------------------------------------------------------------
// Updates über den Service Worker – nie automatisch neu laden
// ---------------------------------------------------------------------------
let waitingWorker = null;
let updateRequested = false;

function showUpdate(worker) {
  waitingWorker = worker;
  $('#update').hidden = false;
}

$('#updateBtn').addEventListener('click', async () => {
  const f = currentFacility();
  if (f && f.inspectionOpen) {
    const ok = await confirmDlg('Prüfung ist noch offen',
      'Die Eingaben sind gespeichert. Nach dem Aktualisieren kann die Prüfung fortgesetzt werden.',
      'Jetzt aktualisieren');
    if (!ok) return;
  }
  updateRequested = true;
  if (waitingWorker) {
    waitingWorker.postMessage({ type: 'SKIP_WAITING' });
    setTimeout(() => location.reload(), 4000); // Rückfall, falls controllerchange ausbleibt
  } else {
    location.reload();
  }
});

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (updateRequested) location.reload();
  });
  window.addEventListener('load', async () => {
    try {
      const reg = await navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' });
      if (reg.waiting && navigator.serviceWorker.controller) showUpdate(reg.waiting);
      reg.addEventListener('updatefound', () => {
        const w = reg.installing;
        if (!w) return;
        w.addEventListener('statechange', () => {
          if (w.state === 'installed' && navigator.serviceWorker.controller) showUpdate(w);
        });
      });
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') reg.update().catch(() => {});
      });
    } catch (e) { /* offline oder nicht unterstützt */ }
  });
}

if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

async function start() {
  let startMessage = '';
  try {
    const res = await store.loadAll();
    data = res.data;
    storageOk = res.persistent;
    if (res.firstRun) {
      data = await store.importAll(sampleData(), 'replace');
      startMessage = 'Beispieldaten geladen.';
    }
    if (res.warning) startMessage = res.warning;
  } catch (e) {
    head.innerHTML = headHtml({ title: 'Übersicht' });
    main.innerHTML = `<p class="note s1">${ICON[1]}<span>Die Daten konnten nicht geladen werden: ${esc(e && e.message ? e.message : e)}</span></p>`;
    return;
  }
  render();
  if (startMessage) toast(startMessage);
}

start();
})();
